<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>농구 모임 프로그램</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f3f5f8;
      color: #222;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card,
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.09);
    }

    .login-card {
      width: 100%;
      max-width: 430px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .subtitle,
    .card-desc {
      color: #555;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cfd6df;
      border-radius: 11px;
      font-size: 15px;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #ff7a00;
      box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.15);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      background: #ff7a00;
      color: white;
      padding: 12px 18px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      background: #b8bec7;
      cursor: not-allowed;
      opacity: 1;
    }

    .outline-btn {
      background: white;
      color: #ff7a00;
      border: 1px solid #ff7a00;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f2937;
      color: white;
      padding: 26px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .header p {
      margin-bottom: 0;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab-btn {
      background: #e5e7eb;
      color: #222;
    }

    .tab-btn.active {
      background: #ff7a00;
      color: white;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr;
      gap: 12px;
      align-items: center;
      margin: 20px 0 12px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      margin-top: 0;
    }

    .checkbox input {
      width: auto;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .small-btn {
      padding: 9px 13px;
      font-size: 13px;
      background: #495057;
      margin-top: 0;
    }

    .danger-btn {
      background: #e03131;
    }

    .message {
      margin-top: 12px;
      font-weight: 700;
      color: #e03131;
    }

    .success {
      color: #2b8a3e;
    }

    .meetup-list {
      display: grid;
      gap: 16px;
    }

    .meetup-card {
      border: 1px solid #e3e7ee;
      border-radius: 18px;
      padding: 22px;
      background: #fbfcfe;
    }

    .meetup-card h3 {
      margin-bottom: 8px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }

    .badge {
      background: #edf2ff;
      color: #364fc7;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .closed {
      background: #ffe3e3;
      color: #c92a2a;
    }

    .open {
      background: #d3f9d8;
      color: #2b8a3e;
    }

    .detail {
      color: #444;
      line-height: 1.6;
    }

    .detail p {
      margin: 6px 0;
    }

    .empty {
      text-align: center;
      color: #777;
      background: #f8f9fa;
      border: 1px dashed #cfd6df;
      border-radius: 16px;
      padding: 34px;
    }

    .joined-text {
      color: #2b8a3e;
      font-weight: 700;
      margin-left: 8px;
    }

    @media (max-width: 850px) {
      .form-grid,
      .filters {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .tabs {
        flex-direction: column;
      }

      .toolbar {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <section id="loginPage" class="page login-page">
      <div class="login-card">
        <h1>🏀 농구 모임 프로그램</h1>
        <p class="subtitle">농구 모임을 만들고 원하는 경기에 참가해보세요.</p>

        <label for="nameInput">이름</label>
        <input type="text" id="nameInput" placeholder="이름을 입력하세요" />

        <label for="idInput">아이디</label>
        <input type="text" id="idInput" placeholder="아이디를 입력하세요" />

        <label for="passwordInput">비밀번호</label>
        <input type="password" id="passwordInput" placeholder="비밀번호를 입력하세요" />

        <button id="loginBtn" type="button">로그인</button>
        <p id="loginMessage" class="message"></p>
      </div>
    </section>

    <section id="mainPage" class="page hidden">
      <header class="header">
        <div>
          <h1>🏀 Basketball Meetup</h1>
          <p><strong id="userName"></strong>님, 환영합니다!</p>
        </div>
        <button id="logoutBtn" type="button" class="outline-btn">로그아웃</button>
      </header>

      <nav class="tabs">
        <button type="button" class="tab-btn active" data-tab="createTab">모임 만들기</button>
        <button type="button" class="tab-btn" data-tab="joinTab">모임 참가하기</button>
      </nav>

      <main>
        <section id="createTab" class="tab-content">
          <div class="card">
            <h2>모임 만들기</h2>
            <p class="card-desc">농구 모임 정보를 입력하고 등록해보세요.</p>

            <div class="form-grid">
              <div>
                <label for="titleInput">모임 제목 *</label>
                <input type="text" id="titleInput" placeholder="예: 토요일 5대5 농구" />
              </div>

              <div>
                <label for="placeInput">장소 *</label>
                <input type="text" id="placeInput" placeholder="예: 고려대 농구장" />
              </div>

              <div>
                <label for="dateInput">날짜 *</label>
                <input type="date" id="dateInput" />
              </div>

              <div>
                <label for="startTimeInput">시작 시간 *</label>
                <input type="time" id="startTimeInput" />
              </div>

              <div>
                <label for="endTimeInput">종료 시간 *</label>
                <input type="time" id="endTimeInput" />
              </div>

              <div>
                <label for="capacityInput">모집 인원 *</label>
                <input type="number" id="capacityInput" min="1" placeholder="예: 10" />
              </div>

              <div>
                <label for="modeInput">경기 방식 *</label>
                <select id="modeInput">
                  <option value="">선택하세요</option>
                  <option value="3대3">3대3</option>
                  <option value="4대4">4대4</option>
                  <option value="5대5">5대5</option>
                  <option value="자유 슈팅">자유 슈팅</option>
                </select>
              </div>

              <div>
                <label for="levelInput">실력 수준 *</label>
                <select id="levelInput">
                  <option value="">선택하세요</option>
                  <option value="초급">초급</option>
                  <option value="중급">중급</option>
                  <option value="상급">상급</option>
                </select>
              </div>
            </div>

            <label for="descriptionInput">간단한 설명</label>
            <textarea id="descriptionInput" placeholder="예: 편하게 뛰실 분들 환영합니다. 개인 공 지참해주세요."></textarea>

            <button id="createMeetupBtn" type="button">모임 등록</button>
            <p id="createMessage" class="message"></p>
          </div>
        </section>

        <section id="joinTab" class="tab-content hidden">
          <div class="card">
            <h2>모임 참가하기</h2>
            <p class="card-desc">조건에 맞는 농구 모임을 검색하고 참가할 수 있습니다.</p>

            <div class="filters">
              <input type="text" id="searchPlaceInput" placeholder="장소 검색" />
              <input type="date" id="filterDateInput" />

              <select id="filterModeInput">
                <option value="">경기 방식 전체</option>
                <option value="3대3">3대3</option>
                <option value="4대4">4대4</option>
                <option value="5대5">5대5</option>
                <option value="자유 슈팅">자유 슈팅</option>
              </select>

              <select id="filterLevelInput">
                <option value="">실력 수준 전체</option>
                <option value="초급">초급</option>
                <option value="중급">중급</option>
                <option value="상급">상급</option>
              </select>

              <label class="checkbox">
                <input type="checkbox" id="openOnlyInput" />
                모집 중만 보기
              </label>
            </div>

            <div class="toolbar">
              <button id="resetFilterBtn" type="button" class="small-btn">필터 초기화</button>
              <button id="clearDataBtn" type="button" class="small-btn danger-btn">전체 모임 삭제</button>
            </div>

            <div id="meetupList" class="meetup-list"></div>
          </div>
        </section>
      </main>
    </section>
  </div>

  <script>
    const loginPage = document.getElementById("loginPage");
    const mainPage = document.getElementById("mainPage");
    const userName = document.getElementById("userName");

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const loginMessage = document.getElementById("loginMessage");
    const createMessage = document.getElementById("createMessage");
    const meetupList = document.getElementById("meetupList");

    const STORAGE_USER = "basketballUserV2";
    const STORAGE_MEETUPS = "basketballMeetupsV2";
    const STORAGE_JOINED = "basketballJoinedV2";

    function loadData(key, fallback) {
      try {
        const saved = localStorage.getItem(key);
        if (!saved) return fallback;
        return JSON.parse(saved);
      } catch (error) {
        return fallback;
      }
    }

    let currentUser = loadData(STORAGE_USER, null);
    let meetups = loadData(STORAGE_MEETUPS, []);
    let joinedByUser = loadData(STORAGE_JOINED, {});

    function saveMeetups() {
      localStorage.setItem(STORAGE_MEETUPS, JSON.stringify(meetups));
      localStorage.setItem(STORAGE_JOINED, JSON.stringify(joinedByUser));
    }

    function saveUser() {
      localStorage.setItem(STORAGE_USER, JSON.stringify(currentUser));
    }

    function getJoinedIds() {
      if (!currentUser) return [];
      if (!joinedByUser[currentUser.id]) {
        joinedByUser[currentUser.id] = [];
      }
      return joinedByUser[currentUser.id];
    }

    function addJoinedMeetup(meetupId) {
      const joinedIds = getJoinedIds();
      if (!joinedIds.includes(meetupId)) {
        joinedIds.push(meetupId);
      }
      joinedByUser[currentUser.id] = joinedIds;
      saveMeetups();
    }

    function showLoginPage() {
      loginPage.classList.remove("hidden");
      mainPage.classList.add("hidden");
    }

    function showMainPage() {
      loginPage.classList.add("hidden");
      mainPage.classList.remove("hidden");
      userName.textContent = currentUser.name;
      renderMeetups();
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    if (currentUser && currentUser.name && currentUser.id) {
      showMainPage();
    } else {
      currentUser = null;
      showLoginPage();
    }

    loginBtn.addEventListener("click", function () {
      const name = document.getElementById("nameInput").value.trim();
      const id = document.getElementById("idInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();

      if (!name || !id || !password) {
        loginMessage.textContent = "이름, 아이디, 비밀번호를 모두 입력해주세요.";
        return;
      }

      currentUser = {
        name: name,
        id: id
      };

      saveUser();
      loginMessage.textContent = "";
      showMainPage();
    });

    logoutBtn.addEventListener("click", function () {
      localStorage.removeItem(STORAGE_USER);
      currentUser = null;
      showLoginPage();
    });

    document.querySelectorAll(".tab-btn").forEach(function (button) {
      button.addEventListener("click", function () {
        document.querySelectorAll(".tab-btn").forEach(function (btn) {
          btn.classList.remove("active");
        });

        document.querySelectorAll(".tab-content").forEach(function (tab) {
          tab.classList.add("hidden");
        });

        button.classList.add("active");
        document.getElementById(button.dataset.tab).classList.remove("hidden");

        if (button.dataset.tab === "joinTab") {
          renderMeetups();
        }
      });
    });

    document.getElementById("createMeetupBtn").addEventListener("click", function () {
      const title = document.getElementById("titleInput").value.trim();
      const place = document.getElementById("placeInput").value.trim();
      const date = document.getElementById("dateInput").value;
      const startTime = document.getElementById("startTimeInput").value;
      const endTime = document.getElementById("endTimeInput").value;
      const capacity = Number(document.getElementById("capacityInput").value);
      const mode = document.getElementById("modeInput").value;
      const level = document.getElementById("levelInput").value;
      const description = document.getElementById("descriptionInput").value.trim();

      if (!title || !place || !date || !startTime || !endTime || !capacity || !mode || !level) {
        createMessage.textContent = "필수 정보를 모두 입력해주세요.";
        createMessage.classList.remove("success");
        return;
      }

      if (startTime >= endTime) {
        createMessage.textContent = "종료 시간은 시작 시간보다 늦어야 합니다.";
        createMessage.classList.remove("success");
        return;
      }

      if (capacity < 1) {
        createMessage.textContent = "모집 인원은 1명 이상이어야 합니다.";
        createMessage.classList.remove("success");
        return;
      }

      const newMeetup = {
        id: Date.now(),
        title: title,
        place: place,
        date: date,
        startTime: startTime,
        endTime: endTime,
        capacity: capacity,
        mode: mode,
        level: level,
        description: description,
        currentCount: 1,
        creatorId: currentUser.id,
        creatorName: currentUser.name
      };

      meetups.push(newMeetup);
      addJoinedMeetup(newMeetup.id);
      saveMeetups();
      clearCreateForm();

      createMessage.textContent = "모임이 성공적으로 등록되었습니다.";
      createMessage.classList.add("success");

      renderMeetups();
    });

    function clearCreateForm() {
      document.getElementById("titleInput").value = "";
      document.getElementById("placeInput").value = "";
      document.getElementById("dateInput").value = "";
      document.getElementById("startTimeInput").value = "";
      document.getElementById("endTimeInput").value = "";
      document.getElementById("capacityInput").value = "";
      document.getElementById("modeInput").value = "";
      document.getElementById("levelInput").value = "";
      document.getElementById("descriptionInput").value = "";
    }

    document.getElementById("searchPlaceInput").addEventListener("input", renderMeetups);
    document.getElementById("filterDateInput").addEventListener("change", renderMeetups);
    document.getElementById("filterModeInput").addEventListener("change", renderMeetups);
    document.getElementById("filterLevelInput").addEventListener("change", renderMeetups);
    document.getElementById("openOnlyInput").addEventListener("change", renderMeetups);

    document.getElementById("resetFilterBtn").addEventListener("click", function () {
      document.getElementById("searchPlaceInput").value = "";
      document.getElementById("filterDateInput").value = "";
      document.getElementById("filterModeInput").value = "";
      document.getElementById("filterLevelInput").value = "";
      document.getElementById("openOnlyInput").checked = false;
      renderMeetups();
    });

    document.getElementById("clearDataBtn").addEventListener("click", function () {
      const ok = confirm("저장된 모든 모임을 삭제하시겠습니까?");
      if (!ok) return;

      meetups = [];
      joinedByUser = {};
      saveMeetups();
      renderMeetups();
    });

    meetupList.addEventListener("click", function (event) {
      if (!event.target.classList.contains("join-btn")) return;

      const meetupId = Number(event.target.dataset.id);
      joinMeetup(meetupId);
    });

    function renderMeetups() {
      if (!meetupList) return;

      const searchPlace = document.getElementById("searchPlaceInput").value.trim().toLowerCase();
      const filterDate = document.getElementById("filterDateInput").value;
      const filterMode = document.getElementById("filterModeInput").value;
      const filterLevel = document.getElementById("filterLevelInput").value;
      const openOnly = document.getElementById("openOnlyInput").checked;

      const joinedIds = getJoinedIds();

      const filteredMeetups = meetups.filter(function (meetup) {
        const isOpen = meetup.currentCount < meetup.capacity;
        const placeMatch = meetup.place.toLowerCase().includes(searchPlace);
        const dateMatch = !filterDate || meetup.date === filterDate;
        const modeMatch = !filterMode || meetup.mode === filterMode;
        const levelMatch = !filterLevel || meetup.level === filterLevel;
        const openMatch = !openOnly || isOpen;

        return placeMatch && dateMatch && modeMatch && levelMatch && openMatch;
      });

      if (filteredMeetups.length === 0) {
        meetupList.innerHTML = '<div class="empty">등록된 모임이 없습니다. 먼저 모임을 만들어보세요.</div>';
        return;
      }

      meetupList.innerHTML = filteredMeetups.map(function (meetup) {
        const isClosed = meetup.currentCount >= meetup.capacity;
        const alreadyJoined = joinedIds.includes(meetup.id);

        let buttonText = "참가하기";
        if (alreadyJoined) {
          buttonText = "참가 완료";
        } else if (isClosed) {
          buttonText = "모집 마감";
        }

        return `
          <div class="meetup-card">
            <h3>${escapeHtml(meetup.title)}</h3>

            <div class="badges">
              <span class="badge">${escapeHtml(meetup.mode)}</span>
              <span class="badge">${escapeHtml(meetup.level)}</span>
              <span class="badge ${isClosed ? "closed" : "open"}">
                ${isClosed ? "모집 마감" : "모집 중"}
              </span>
            </div>

            <div class="detail">
              <p><strong>장소:</strong> ${escapeHtml(meetup.place)}</p>
              <p><strong>날짜:</strong> ${escapeHtml(meetup.date)}</p>
              <p><strong>시간:</strong> ${escapeHtml(meetup.startTime)} ~ ${escapeHtml(meetup.endTime)}</p>
              <p><strong>인원:</strong> ${meetup.currentCount} / ${meetup.capacity}</p>
              <p><strong>개설자:</strong> ${escapeHtml(meetup.creatorName)}</p>
              <p><strong>설명:</strong> ${meetup.description ? escapeHtml(meetup.description) : "설명이 없습니다."}</p>
            </div>

            <button 
              type="button" 
              class="join-btn" 
              data-id="${meetup.id}" 
              ${isClosed || alreadyJoined ? "disabled" : ""}
            >
              ${buttonText}
            </button>

            ${alreadyJoined ? '<span class="joined-text">이미 참가한 모임입니다.</span>' : ""}
          </div>
        `;
      }).join("");
    }

    function joinMeetup(meetupId) {
      const meetup = meetups.find(function (item) {
        return item.id === meetupId;
      });

      if (!meetup) {
        alert("모임을 찾을 수 없습니다.");
        return;
      }

      const joinedIds = getJoinedIds();

      if (joinedIds.includes(meetupId)) {
        alert("이미 참가한 모임입니다.");
        return;
      }

      if (meetup.currentCount >= meetup.capacity) {
        alert("이미 모집이 마감된 모임입니다.");
        return;
      }

      meetup.currentCount += 1;
      addJoinedMeetup(meetupId);
      saveMeetups();

      alert("참가가 완료되었습니다.");
      renderMeetups();
    }
  </script>
</body>
</html>
