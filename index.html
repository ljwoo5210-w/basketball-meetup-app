<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>농구 모임 프로그램</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <section id="loginPage" class="page login-page">
      <div class="login-card">
        <h1>🏀 농구 모임 프로그램</h1>
        <p>농구 모임을 만들고 원하는 경기에 참가해보세요.</p>

        <label>이름</label>
        <input type="text" id="nameInput" placeholder="이름을 입력하세요" />

        <label>아이디</label>
        <input type="text" id="idInput" placeholder="아이디를 입력하세요" />

        <label>비밀번호</label>
        <input type="password" id="passwordInput" placeholder="비밀번호를 입력하세요" />

        <button id="loginBtn">로그인</button>
        <p id="loginMessage" class="message"></p>
      </div>
    </section>

    <section id="mainPage" class="page hidden">
      <header class="header">
        <div>
          <h1>🏀 Basketball Meetup</h1>
          <p><span id="userName"></span>님, 환영합니다!</p>
        </div>
        <button id="logoutBtn" class="outline-btn">로그아웃</button>
      </header>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="createTab">모임 만들기</button>
        <button class="tab-btn" data-tab="joinTab">모임 참가하기</button>
      </nav>

      <main>
        <section id="createTab" class="tab-content">
          <div class="card">
            <h2>모임 만들기</h2>

            <div class="form-grid">
              <div>
                <label>모임 제목 *</label>
                <input type="text" id="titleInput" placeholder="예: 토요일 5대5 농구" />
              </div>

              <div>
                <label>장소 *</label>
                <input type="text" id="placeInput" placeholder="예: 고려대 농구장" />
              </div>

              <div>
                <label>날짜 *</label>
                <input type="date" id="dateInput" />
              </div>

              <div>
                <label>시작 시간 *</label>
                <input type="time" id="startTimeInput" />
              </div>

              <div>
                <label>종료 시간 *</label>
                <input type="time" id="endTimeInput" />
              </div>

              <div>
                <label>모집 인원 *</label>
                <input type="number" id="capacityInput" min="1" placeholder="예: 10" />
              </div>

              <div>
                <label>경기 방식 *</label>
                <select id="modeInput">
                  <option value="">선택하세요</option>
                  <option value="3대3">3대3</option>
                  <option value="4대4">4대4</option>
                  <option value="5대5">5대5</option>
                  <option value="자유 슈팅">자유 슈팅</option>
                </select>
              </div>

              <div>
                <label>실력 수준 *</label>
                <select id="levelInput">
                  <option value="">선택하세요</option>
                  <option value="초급">초급</option>
                  <option value="중급">중급</option>
                  <option value="상급">상급</option>
                </select>
              </div>
            </div>

            <label>간단한 설명</label>
            <textarea id="descriptionInput" placeholder="모임에 대한 설명을 입력하세요"></textarea>

            <button id="createMeetupBtn">모임 등록</button>
            <p id="createMessage" class="message"></p>
          </div>
        </section>

        <section id="joinTab" class="tab-content hidden">
          <div class="card">
            <h2>모임 참가하기</h2>

            <div class="filters">
              <input type="text" id="searchPlaceInput" placeholder="장소 검색" />
              <input type="date" id="filterDateInput" />

              <select id="filterModeInput">
                <option value="">경기 방식 전체</option>
                <option value="3대3">3대3</option>
                <option value="4대4">4대4</option>
                <option value="5대5">5대5</option>
                <option value="자유 슈팅">자유 슈팅</option>
              </select>

              <select id="filterLevelInput">
                <option value="">실력 수준 전체</option>
                <option value="초급">초급</option>
                <option value="중급">중급</option>
                <option value="상급">상급</option>
              </select>

              <label class="checkbox">
                <input type="checkbox" id="openOnlyInput" />
                모집 중만 보기
              </label>
            </div>

            <div id="meetupList" class="meetup-list"></div>
          </div>
        </section>
      </main>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
